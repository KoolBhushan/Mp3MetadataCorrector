name: Build and Package Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Auto-Incremented Version
        id: versioning
        shell: pwsh
        run: |
          $majorMinor = "1.0"
          $buildNumber = "${{ github.run_number }}"
          $appVersion = "$majorMinor.$buildNumber"
          Write-Host "Determined Auto-Incremented Version: $appVersion"
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Tools (yt-dlp & ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Mp3MetadataCorrector/tools" -Force | Out-Null

          Write-Host "Downloading latest yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "Mp3MetadataCorrector/tools/yt-dlp.exe"

          Write-Host "Configuring ffmpeg..."
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
              Write-Host "Installing ffmpeg via Chocolatey..."
              choco install ffmpeg -y --no-progress
          }

          $ffmpegCmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          $ffprobeCmd = Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
              Copy-Item $ffmpegCmd.Source "Mp3MetadataCorrector/tools/ffmpeg.exe" -Force
          }
          if ($ffprobeCmd) {
              Copy-Item $ffprobeCmd.Source "Mp3MetadataCorrector/tools/ffprobe.exe" -Force
          }

          Get-ChildItem "Mp3MetadataCorrector/tools"

      - name: Run Verification Unit Tests
        shell: pwsh
        run: |
          dotnet run --project Mp3MetadataCorrector.Tests/Mp3MetadataCorrector.Tests.csproj -c Release

      - name: Publish WinUI 3 Application
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          dotnet publish Mp3MetadataCorrector/Mp3MetadataCorrector.csproj -c Release -r win-x64 --self-contained false -p:Version=$ver -p:AssemblyVersion=$ver -p:FileVersion=$ver -o publish

      - name: Publish CLI Tool (mp3corrector)
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          New-Item -ItemType Directory -Path "Output_Installer" -Force | Out-Null
          New-Item -ItemType Directory -Path "Output_Cli" -Force | Out-Null
          dotnet publish Mp3MetadataCorrector.Cli/Mp3MetadataCorrector.Cli.csproj -c Release -r win-x64 --self-contained false -p:Version=$ver -p:AssemblyVersion=$ver -p:FileVersion=$ver -o Output_Cli
          Copy-Item "Output_Cli/mp3corrector.exe" "publish/mp3corrector.exe" -Force
          Copy-Item "Output_Cli/mp3corrector.exe" "Output_Installer/mp3corrector_v$ver.exe" -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("Output_Cli", "Output_Installer/mp3corrector-cli-v$ver.zip")

      - name: Package App Payload Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("publish", "installer/app_payload.zip")
          Get-Item "installer/app_payload.zip" | Select-Object Length, LastWriteTime

      - name: Build Standalone Windows Setup Installer
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          New-Item -ItemType Directory -Path "Output_Installer" -Force | Out-Null
          dotnet publish installer/Mp3MetadataCorrector.Installer.csproj -c Release -p:Version=$ver -p:AssemblyVersion=$ver -p:FileVersion=$ver -o Output_Installer
          Copy-Item "Output_Installer/Mp3MetadataCorrector_Setup.exe" "Output_Installer/Mp3MetadataCorrector_Setup_v$ver.exe" -Force

      - name: Compile Inno Setup Installer (if available)
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
              Write-Host "Compiling with Inno Setup for version $ver..."
              & $iscc "/DMyAppVersion=$ver" installer/setup.iss
          }

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path "Output_Installer"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mp3MetadataCorrector-Installer-v${{ env.APP_VERSION }}
          path: Output_Installer/*
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "MP3 Metadata Corrector v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Output_Installer/*.exe
            Output_Installer/*.zip
            installer/app_payload.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
